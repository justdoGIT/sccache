name: Performance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Seed the performance baseline
        type: boolean
        required: false
        default: false

jobs:
  performance:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@a7a1af9db4207b36b60a394faae6df9f0c81607c
    with:
      templates_ref: a7a1af9db4207b36b60a394faae6df9f0c81607c
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
