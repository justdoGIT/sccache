name: Dependency updates

on:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without applying dependency updates
        type: boolean
        required: false
        default: true

jobs:
  update:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-dependency-updates.yml@a7a1af9db4207b36b60a394faae6df9f0c81607c
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
