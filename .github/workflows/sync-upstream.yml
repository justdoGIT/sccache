name: Sync Upstream Repository

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    name: Sync Main & Dev-Main with Mozilla Upstream
    if: github.repository != 'mozilla/sccache'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Upstream Remote
        run: |
          git remote add upstream https://github.com/mozilla/sccache.git || git remote set-url upstream https://github.com/mozilla/sccache.git
          git fetch upstream main --tags

      - name: Sync Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B main origin/main
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            git merge --ff-only upstream/main
            if ! git push origin main; then
              git push -f origin main:chore/sync-upstream-main
              gh pr create --base main --head chore/sync-upstream-main \
                --title "chore(sync): fast-forward main to upstream/main" \
                --body "Automated sync with mozilla/sccache main." || true
              gh pr merge chore/sync-upstream-main --merge --delete-branch || true
            fi
          fi

      - name: Sync Dev-Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B dev-main origin/dev-main
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            git merge upstream/main -m "ci: merge latest upstream main into dev-main"
            if ! git push origin dev-main; then
              git push -f origin dev-main:chore/sync-upstream-dev-main
              gh pr create --base dev-main --head chore/sync-upstream-dev-main \
                --title "chore(sync): merge upstream/main into dev-main" \
                --body "Automated merge of mozilla/sccache main into dev-main." || true
              gh pr merge chore/sync-upstream-dev-main --merge --delete-branch || true
            fi
          fi
